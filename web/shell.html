<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b10">
  <title>Jacob's Matrix</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23080b10'/%3E%3Cpath d='M18 14h12v29c0 8-5 12-13 12-3 0-6-1-8-2l3-9c1 1 3 1 4 1 2 0 2-1 2-4V14zm18 0h11l9 41H45l-1-9h-7l-1 9H25l11-41zm2 23h5l-2-14-3 14z' fill='%23e8b961'/%3E%3C/svg%3E">
  <script>
    window.coi = {
      coepCredentialless: function () { return false; }
    };
  </script>
  <script src="./coi-serviceworker.js"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-monospace, "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      background: #080b10;
      color: #d9dfeb;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 15%, #192130 0, #0b0f16 38rem, #06080c 100%);
    }
    main {
      width: min(100%, 1344px);
      padding: 24px 16px 32px;
      text-align: center;
    }
    h1 {
      margin: 0 0 6px;
      color: #e8b961;
      font-size: clamp(1.25rem, 3vw, 1.8rem);
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .subtitle {
      margin: 0 0 18px;
      color: #7f8999;
      font-size: .8rem;
    }
    .screen {
      position: relative;
      width: min(100%, 1280px);
      aspect-ratio: 8 / 5;
      margin: 0 auto;
      overflow: hidden;
      background: #000;
      border: 1px solid #293242;
      border-radius: 4px;
      box-shadow: 0 16px 60px #000a, 0 0 0 1px #000 inset;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #unicode-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      image-rendering: auto;
    }
    #loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 12px;
      padding: 24px;
      background: #05070af2;
      color: #cbd3df;
      transition: opacity .2s ease;
    }
    #loading.done {
      pointer-events: none;
      opacity: 0;
    }
    .spinner {
      width: 32px;
      height: 32px;
      margin: auto;
      border: 3px solid #354052;
      border-top-color: #e8b961;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status { min-height: 1.3em; font-size: .85rem; }
    .help {
      margin: 14px 0 0;
      color: #8d96a5;
      font-size: .78rem;
      line-height: 1.55;
    }
    .help kbd {
      padding: 1px 5px;
      border: 1px solid #3b4555;
      border-bottom-width: 2px;
      border-radius: 3px;
      background: #141a23;
      color: #dce2ec;
      font: inherit;
    }
    .source-links {
      margin: 8px 0 0;
      color: #697486;
      font-size: .74rem;
    }
    .source-links a { color: #aab6c8; }
  </style>
</head>
<body>
  <main>
    <h1>Jacob's Matrix</h1>
    <p class="subtitle" id="page-subtitle">Release 004 · multithreaded WebAssembly port</p>
    <div class="screen">
      <canvas id="canvas" width="640" height="400" tabindex="0" aria-label="Jacob's Matrix game"></canvas>
      <canvas id="unicode-canvas" width="1280" height="800" aria-hidden="true"></canvas>
      <div id="loading" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <div id="status">Preparing multithreaded WebAssembly…</div>
      </div>
    </div>
    <p class="help" id="page-help">
      Click the game, then use <kbd>Arrow keys</kbd> and <kbd>Enter</kbd>.
      Press <kbd>?</kbd> in game for full controls. Audio starts after keyboard input.
    </p>
    <p class="source-links">
      <a id="original-link" href="http://www.zincland.com/7drl/jacob/" target="_blank" rel="noreferrer">Original 7DRL page</a>
      · <a id="repository-link" href="https://github.com/refracta/jacobs-matrix" target="_blank" rel="noreferrer">GitHub repository</a>
    </p>
  </main>

  <!-- Emscripten requires its script placeholder in the shell. Keeping the
       generated tag inert prevents pthread startup before the COI worker's
       security headers take effect on the first GitHub Pages visit. -->
  <template id="emscripten-script-template">{{{ SCRIPT }}}</template>

  <script>
    (function () {
      var canvas = document.getElementById("canvas");
      var unicodeCanvas = document.getElementById("unicode-canvas");
      var loading = document.getElementById("loading");
      var status = document.getElementById("status");

      window.__jacobSetLanguage = function (korean) {
        document.documentElement.lang = korean ? "ko" : "en";
        document.getElementById("page-subtitle").textContent = korean
          ? "릴리스 004 · 멀티스레드 WebAssembly 포트"
          : "Release 004 · multithreaded WebAssembly port";
        document.getElementById("page-help").innerHTML = korean
          ? "게임 화면을 클릭한 뒤 <kbd>방향키</kbd>와 <kbd>Enter</kbd>를 사용하세요. 게임 중 <kbd>?</kbd>를 누르면 전체 조작법을 볼 수 있습니다. 키를 입력하면 음악이 시작됩니다."
          : "Click the game, then use <kbd>Arrow keys</kbd> and <kbd>Enter</kbd>. Press <kbd>?</kbd> in game for full controls. Audio starts after keyboard input.";
        document.getElementById("original-link").textContent = korean ? "원작 7DRL 페이지" : "Original 7DRL page";
        document.getElementById("repository-link").textContent = korean ? "GitHub 저장소" : "GitHub repository";
      };

      window.__jacobDrawUnicode = function (pointer, width, height, cellSize,
          charOffset, colorOffset, cellWidth, cellHeight, fade, fadeRed,
          fadeGreen, fadeBlue) {
        var context = unicodeCanvas.getContext("2d");
        var scaleX = unicodeCanvas.width / (width * cellWidth);
        var scaleY = unicodeCanvas.height / (height * cellHeight);
        context.clearRect(0, 0, unicodeCanvas.width, unicodeCanvas.height);
        context.save();
        var fontFamily = "'Malgun Gothic', 'Apple SD Gothic Neo', 'NanumGothic', 'Noto Sans CJK KR', sans-serif";
        context.font = "500 " + Math.floor(cellHeight * scaleY * 0.875) + "px " + fontFamily;
        context.textAlign = "center";
        context.textBaseline = "middle";

        for (var y = 0; y < height; y++) {
          for (var x = 0; x < width; x++) {
            var address = pointer + (x + y * width) * cellSize;
            var codepoint = HEAP32[(address + charOffset) >> 2];
            if (codepoint <= 255) continue;
            if (codepoint > 0x10ffff || (codepoint >= 0xd800 && codepoint <= 0xdfff)) {
              codepoint = 0xfffd;
            }

            var red = HEAPU8[address + colorOffset];
            var green = HEAPU8[address + colorOffset + 1];
            var blue = HEAPU8[address + colorOffset + 2];
            red = red * fade / 255 + fadeRed * (255 - fade) / 255;
            green = green * fade / 255 + fadeGreen * (255 - fade) / 255;
            blue = blue * fade / 255 + fadeBlue * (255 - fade) / 255;
            context.fillStyle = "rgb(" + red + "," + green + "," + blue + ")";
            context.fillText(String.fromCodePoint(codepoint),
              (x * cellWidth + cellWidth / 2) * scaleX,
              (y * cellHeight + cellHeight / 2) * scaleY);
          }
        }
        context.restore();
      };

      function setStatus(message) {
        status.textContent = message || "Loading…";
      }

      window.Module = {
        canvas: canvas,
        print: function (message) { console.log(message); },
        printErr: function (message) { console.error(message); },
        setStatus: setStatus,
        monitorRunDependencies: function (remaining) {
          if (remaining) setStatus("Loading game data… (" + remaining + ")");
        },
        onRuntimeInitialized: function () {
          window.__jacobRuntimeReady = true;
          loading.classList.add("done");
          canvas.focus();
        }
      };

      window.addEventListener("error", function (event) {
        if (!window.__jacobRuntimeReady) {
          setStatus("Could not start the game: " + (event.message || "unknown error"));
        }
      });
      canvas.addEventListener("pointerdown", function () { canvas.focus(); });

      if (!window.crossOriginIsolated) {
        setStatus("Enabling multithreaded WebAssembly…");
        window.setTimeout(function () {
          if (!window.crossOriginIsolated) {
            setStatus("This browser could not enable the security isolation required for threads. Try a current Chrome, Edge, or Firefox window outside private browsing.");
          }
        }, 10000);
        return;
      }

      var script = document.createElement("script");
      script.src = "./index.js";
      script.async = true;
      script.onerror = function () { setStatus("Could not download the game runtime."); };
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
