<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b10">
  <title>Jacob's Matrix</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23080b10'/%3E%3Cpath d='M18 14h12v29c0 8-5 12-13 12-3 0-6-1-8-2l3-9c1 1 3 1 4 1 2 0 2-1 2-4V14zm18 0h11l9 41H45l-1-9h-7l-1 9H25l11-41zm2 23h5l-2-14-3 14z' fill='%23e8b961'/%3E%3C/svg%3E">
  <script>
    window.coi = {
      coepCredentialless: function () { return false; }
    };
  </script>
  <script src="./coi-serviceworker.js"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-monospace, "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      background: #080b10;
      color: #d9dfeb;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 15%, #192130 0, #0b0f16 38rem, #06080c 100%);
    }
    main {
      width: min(100%, 1024px);
      padding: 24px 16px 32px;
      text-align: center;
    }
    h1 {
      margin: 0 0 6px;
      color: #e8b961;
      font-size: clamp(1.25rem, 3vw, 1.8rem);
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .subtitle {
      margin: 0 0 18px;
      color: #7f8999;
      font-size: .8rem;
    }
    .screen {
      position: relative;
      width: min(100%, 960px);
      aspect-ratio: 8 / 5;
      margin: 0 auto;
      overflow: hidden;
      background: #000;
      border: 1px solid #293242;
      border-radius: 4px;
      box-shadow: 0 16px 60px #000a, 0 0 0 1px #000 inset;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 12px;
      padding: 24px;
      background: #05070af2;
      color: #cbd3df;
      transition: opacity .2s ease;
    }
    #loading.done {
      pointer-events: none;
      opacity: 0;
    }
    .spinner {
      width: 32px;
      height: 32px;
      margin: auto;
      border: 3px solid #354052;
      border-top-color: #e8b961;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status { min-height: 1.3em; font-size: .85rem; }
    .help {
      margin: 14px 0 0;
      color: #8d96a5;
      font-size: .78rem;
      line-height: 1.55;
    }
    .help kbd {
      padding: 1px 5px;
      border: 1px solid #3b4555;
      border-bottom-width: 2px;
      border-radius: 3px;
      background: #141a23;
      color: #dce2ec;
      font: inherit;
    }
  </style>
</head>
<body>
  <main>
    <h1>Jacob's Matrix</h1>
    <p class="subtitle">Release 004 · multithreaded WebAssembly port</p>
    <div class="screen">
      <canvas id="canvas" width="640" height="400" tabindex="0" aria-label="Jacob's Matrix game"></canvas>
      <div id="loading" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <div id="status">Preparing multithreaded WebAssembly…</div>
      </div>
    </div>
    <p class="help">
      Click the game, then use <kbd>Arrow keys</kbd> and <kbd>Enter</kbd>.
      Press <kbd>?</kbd> in game for full controls. Audio starts after keyboard input.
    </p>
  </main>

  <!-- Emscripten requires its script placeholder in the shell. Keeping the
       generated tag inert prevents pthread startup before the COI worker's
       security headers take effect on the first GitHub Pages visit. -->
  <template id="emscripten-script-template">{{{ SCRIPT }}}</template>

  <script>
    (function () {
      var canvas = document.getElementById("canvas");
      var loading = document.getElementById("loading");
      var status = document.getElementById("status");

      function setStatus(message) {
        status.textContent = message || "Loading…";
      }

      window.Module = {
        canvas: canvas,
        print: function (message) { console.log(message); },
        printErr: function (message) { console.error(message); },
        setStatus: setStatus,
        monitorRunDependencies: function (remaining) {
          if (remaining) setStatus("Loading game data… (" + remaining + ")");
        },
        onRuntimeInitialized: function () {
          window.__jacobRuntimeReady = true;
          loading.classList.add("done");
          canvas.focus();
        }
      };

      window.addEventListener("error", function (event) {
        if (!window.__jacobRuntimeReady) {
          setStatus("Could not start the game: " + (event.message || "unknown error"));
        }
      });
      canvas.addEventListener("pointerdown", function () { canvas.focus(); });

      if (!window.crossOriginIsolated) {
        setStatus("Enabling multithreaded WebAssembly…");
        window.setTimeout(function () {
          if (!window.crossOriginIsolated) {
            setStatus("This browser could not enable the security isolation required for threads. Try a current Chrome, Edge, or Firefox window outside private browsing.");
          }
        }, 10000);
        return;
      }

      var script = document.createElement("script");
      script.src = "./index.js";
      script.async = true;
      script.onerror = function () { setStatus("Could not download the game runtime."); };
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
