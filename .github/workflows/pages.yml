name: Build and deploy the web port

on:
  push:
    branches:
      - release-004-web
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release-004-web
        uses: actions/checkout@v7

      - name: Build multithreaded WebAssembly
        shell: bash
        run: |
          git clone --depth 1 --branch 6.0.6 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.6
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.6
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          make -C web

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
